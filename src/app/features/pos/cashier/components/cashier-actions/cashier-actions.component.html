<div class="action-bar-container">
      <div class="side-toggle right-toggle">
            <button class="toggle-btn" (click)="toggleRightSidebar.emit()">
                  <span class="material-icons-outlined">receipt_long</span>
                  <span class="text">الفواتير</span>
            </button>
      </div>

      <div class="main-actions-bar">
            <button class="btn-main-action" (click)="receiptMode === 'VIEW' ? print.emit() : saveAndPrint.emit()" [disabled]="isLoading || hasStockErrors">
                  <div class="btn-content">
                        <span class="material-icons-outlined">print</span>
                        <ng-container *ngIf="receiptMode === 'VIEW'">
                              <span class="text">طباعة <span class="shortcut">(F12)</span></span>
                        </ng-container>
                        <ng-container *ngIf="receiptMode !== 'VIEW'">
                              <span class="text">حفظ وطباعة <span class="shortcut">(F12)</span></span>
                        </ng-container>
                  </div>
            </button>

            <div class="middle-group">
                  <button class="btn-outline" (click)="save.emit()" *ngIf="receiptMode !== 'VIEW'"
                        [disabled]="isLoading || hasStockErrors">
                        <span class="text">حفظ</span>
                        <span class="material-icons-outlined">save</span>
                        <span class="shortcut">(F11)</span>
                  </button>

                  <button class="btn-outline" (click)="newReceipt.emit()">
                        <span class="text">جديد</span>
                        <span class="material-icons-outlined">add_circle_outline</span>
                        <span class="shortcut">(F1)</span>
                  </button>

            </div>

            <!-- TODO: re-enable draft section later when draft mode UX is finalized -->
            <!--
            <div class="drafts-section" (click)="drafts.emit()">
                  <div class="drafts-card">
                        <div class="badge" *ngIf="draftsCount > 0">{{ draftsCount }}</div>
                        <div class="drafts-info">
                              <span class="title">مسودة</span>
                              <span class="subtitle">{{ draftsCount }} فواتير لم تحفظ</span>
                        </div>
                  </div>
            </div>
            -->

            <div class="left-action-group" *ngIf="(receipt?.id && receiptMode !== 'NEW') || receiptMode === 'VIEW'">
                  <span class="group-label">
                        <span class="material-icons-outlined">info</span>
                        مرتد كاشير:
                  </span>

                  <button class="btn-outline" (click)="edit.emit()" *ngIf="receiptMode === 'VIEW'">
                        <span class="text">تعديل</span>
                        <span class="material-icons-outlined">edit</span>
                        <span class="shortcut">(F2)</span>
                  </button>

                  <button class="btn-delete" (click)="refundReceipt.emit()" *ngIf="receipt?.id">
                        <span class="material-icons-outlined">undo</span>
                        <span class="text">استرجاع</span>
                  </button>


            </div>
      </div>

      <!-- Receipt Totals Card (Outer Card: Metrics | Inner Green Card: Amount) -->
      <div class="header-total-card">
            <!-- Secondary Metrics: Total Pieces & Total Items -->
            <div class="header-metrics-group">
                  <div class="metric-item" title="عدد القطع الكلي">
                        <span class="metric-label">القطع</span>
                        <span class="metric-value">{{ totalQuantity }}</span>
                  </div>
                  <div class="metric-divider"></div>
                  <div class="metric-item" title="عدد الأصناف المختلفة">
                        <span class="metric-label">الأصناف</span>
                        <span class="metric-value">{{ distinctItemsCount }}</span>
                  </div>
            </div>

            <!-- Primary Metric: Inner Green Amount Card -->
            <div class="header-amount-card">
                  <div class="amount-display" dir="ltr">
                        <span class="total-integer">{{ integerPart }}</span>
                        <span class="total-decimal">{{ decimalPart }}</span>
                        <span class="total-currency">جنية</span>
                  </div>
            </div>
      </div>
</div>
